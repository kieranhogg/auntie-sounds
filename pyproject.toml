[project]
name = "auntie-sounds"
version = "2.1.0b1"
description = "A library for interacting with BBC Radio stations and streams"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiofiles>=25.1.0",
    "aiohttp>=3.14.1",
    "appdirs>=1.4.4",
    "beautifulsoup4>=4.15.0",
    "colorlog>=6.10.1",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "pytz>=2026.3",
    "typing-extensions>=4.16.0",
]

[build-system]
requires = ["uv_build>=0.11.8,<0.12"]
build-backend = "uv_build"

[tool.ty.environment]
root = ["./src"]

[tool.uv]
required-version = ">=0.11.8,<0.12"

[tool.uv.build-backend]
package-dir = "src"
namespace = true
module-name = "sounds"

[tool.pytest.ini_options]
addopts = [
    "--maxfail=1",
    "--cov=sounds",
    "--import-mode=importlib"
]
pythonpath = [
  "src"
]
anyio_mode = "auto"
markers = [
    "api",
]

[dependency-groups]
dev = [
    "aioresponses>=0.7.9",
    "anyio>=4.14.0",
    "mypy>=2.3.1",
    "pytest-cov>=7.0.0",
    "pytest>=9.0.1",
    "python-dotenv>=1.2.3",
    "ruff>=0.16.5",
    "sphinx-autoapi>=3.6.1",
    "sphinx>=9.0.4",
    "ty>=0.0.84",
    "types-aiofiles>=25.1.0.20260518",
    "types-appdirs>=1.4.3.5",
    "types-pytz>=2026.3.1.20260727",
]

[tool.coverage.run]
omit = [
    "src/sounds/sounds_types.py",
]
