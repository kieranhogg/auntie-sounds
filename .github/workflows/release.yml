name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump level
        required: true
        type: choice
        options: [ patch, minor, major, stable, beta ]
        default: patch

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    permissions:
      contents: read
    uses: $/.github/workflows/ci.yml

  stable_release:
    needs: ci
    if: github.ref == 'refs/heads/stable'
    runs-on: ubuntu-latest
    permissions:
      # Push the release commit and tag, and create the GitHub release
      contents: write
      # Trusted publishing to PyPI
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/auntie-sounds
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: stable
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          # Match [tool.uv] required-version, and no cache in a job that publishes
          version-file: "pyproject.toml"
          enable-cache: false

      - name: Install deps
        run: uv sync --locked --all-extras --dev

      - name: Bump version
        run: uv version --bump ${{ inputs.bump }}

      - name: Read new version
        id: v
        run: |
          version=$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Finalize CHANGELOG.md
        id: notes
        run: python3 ${{ github.workspace }}/scripts/changelog.py "${{ steps.v.outputs.version }}"

      - name: Update lockfile
        run: uv lock

      - name: Commit release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml uv.lock CHANGELOG.md
          git commit -m "chore: release v${{ steps.v.outputs.version }}"
          git tag "v${{ steps.v.outputs.version }}"
          git push origin stable
          git push origin "v${{ steps.v.outputs.version }}"

      - name: Build
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.3

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.v.outputs.version }}" \
            dist/* \
            --title "v${{ steps.v.outputs.version }}" \
            --notes-file release_notes.md

      - name: Clean up
        run: rm release_notes.md


  beta_release:
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version-file: "pyproject.toml"
          enable-cache: false

      - name: Install deps
        run: uv sync --locked --all-extras --dev

      - name: Bump version (Beta)
        run: |
          uv version --bump beta

      - name: Read new version
        id: v
        run: |
          version=$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Finalize CHANGELOG.md
        id: notes
        run: python3 ${{ github.workspace }}/scripts/changelog.py "${{ steps.v.outputs.version }}"

      - name: Update lockfile
        run: uv lock

      - name: Commit release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml uv.lock CHANGELOG.md
          git commit -m "chore: beta release v${{ steps.v.outputs.version }}"
          git tag "v${{ steps.v.outputs.version }}"
          git push origin main
          git push origin "v${{ steps.v.outputs.version }}"

      - name: Build
        run: uv build

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.v.outputs.version }}" \
            dist/* \
            --title "v${{ steps.v.outputs.version }}" \
            --notes-file release_notes.md \
            --prerelease

      - name: Clean up
        run: rm release_notes.md